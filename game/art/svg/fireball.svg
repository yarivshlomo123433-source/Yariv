      <stop offset="0" stop-color="#fffbe0"/>
      <stop offset="0.35" stop-color="#ffd23f"/>
      <stop offset="0.75" stop-color="#ff7a1a"/>
      <stop offset="1" stop-color="#d1301a"/>
    </radialGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1a"/>
