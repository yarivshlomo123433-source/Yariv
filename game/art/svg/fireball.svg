  <path d="M30 4 C 18 4, 8 8, 1 16 C 8 24, 18 28, 30 28 Z" fill="url(#tail)"/>
  <path d="M26 7 C 18 9, 12 12, 6 16 C 12 20, 18 23, 26 25" fill="none" stroke="#ffd23f" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
