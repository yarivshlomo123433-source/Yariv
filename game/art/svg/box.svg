<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56">
  <!-- Power-up capsule that floats over the floor, 2x the in-game size (28x28). Run through it to grab a power. -->
  <defs>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9ff0ff" stop-opacity="0.85"/>
      <stop offset="0.8" stop-color="#5b7cff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a3fe0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6b0" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff6b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6b8"/>
      <stop offset="1" stop-color="#ffb000"/>
    </linearGradient>
  </defs>
  <circle cx="28" cy="28" r="27" fill="url(#glow)"/>
  <rect x="7" y="7" width="42" height="42" rx="12" fill="url(#glass)" stroke="#1b1f3b" stroke-width="2.4"/>
  <path d="M28 15 L 31.6 23.2 L 40.4 24 L 33.8 29.8 L 35.8 38.4 L 28 33.8 L 20.2 38.4 L 22.2 29.8 L 15.6 24 L 24.4 23.2 Z"
        fill="url(#star)" stroke="#a15c00" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M13 17 C 14 13, 17 11.5, 21 11.5" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>
