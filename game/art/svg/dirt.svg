<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Underground fill tile, drawn at 2x the in-game size (32x32). Flat base colour and
       pebbles away from the edges, so it repeats in every direction without seams. -->
  <defs>
    <radialGradient id="pebble" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#d8a877"/>
      <stop offset="0.6" stop-color="#a87445"/>
      <stop offset="1" stop-color="#6e4428"/>
    </radialGradient>
    <radialGradient id="dark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5a3825" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#5a3825" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" fill="#8a5a36"/>
  <circle cx="22" cy="20" r="11" fill="url(#dark)"/>
  <circle cx="48" cy="46" r="12" fill="url(#dark)"/>
  <g stroke="#4d2f1b" stroke-width="1">
    <ellipse cx="40" cy="14" rx="4.5" ry="3.2" fill="url(#pebble)"/>
    <ellipse cx="15" cy="44" rx="4" ry="3" fill="url(#pebble)"/>
    <ellipse cx="34" cy="34" rx="2.6" ry="2" fill="url(#pebble)"/>
    <ellipse cx="54" cy="28" rx="2.4" ry="1.8" fill="url(#pebble)"/>
    <ellipse cx="28" cy="56" rx="3" ry="2.2" fill="url(#pebble)"/>
  </g>
  <g fill="#ffffff" opacity="0.45">
    <ellipse cx="38.6" cy="12.8" rx="1.6" ry="0.9"/>
    <ellipse cx="13.8" cy="42.8" rx="1.4" ry="0.9"/>
    <ellipse cx="33.2" cy="33.2" rx="0.9" ry="0.6"/>
  </g>
</svg>
