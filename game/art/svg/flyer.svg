<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 48" width="64" height="48">
  <!-- Buzzing flyer that bobs up and down in the air. 2x the in-game size (32x24). Faces left. -->
  <defs>
    <radialGradient id="body" cx="0.35" cy="0.3" r="0.85">
      <stop offset="0" stop-color="#ffd38a"/>
      <stop offset="0.4" stop-color="#ff8a3d"/>
      <stop offset="0.85" stop-color="#d1461f"/>
      <stop offset="1" stop-color="#9e3115"/>
    </radialGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#bfe6ff" stop-opacity="0.75"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f2e2d6"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="0.8"/></filter>
  </defs>
  <!-- wings -->
  <path d="M30 14 C 24 2, 40 -1, 42 10 C 42 14, 36 16, 30 14 Z" fill="url(#wing)" stroke="#1b1f3b" stroke-width="2"/>
  <path d="M38 15 C 40 4, 56 4, 54 14 C 52 18, 44 18, 38 15 Z" fill="url(#wing)" stroke="#1b1f3b" stroke-width="2"/>
  <!-- stinger -->
  <path d="M52 30 L 62 31 L 52 35 Z" fill="#3a2a2a" stroke="#1b1f3b" stroke-width="1.6" stroke-linejoin="round"/>
  <!-- body -->
  <ellipse cx="32" cy="30" rx="22" ry="15" fill="url(#body)" stroke="#1b1f3b" stroke-width="2.4"/>
  <path d="M38 16.5 C 41 22, 41 38, 38 44 M46 19.5 C 48.5 24, 48.5 36, 46 41" fill="none" stroke="#5a2412" stroke-width="3.2" stroke-linecap="round" opacity="0.8"/>
  <ellipse cx="22" cy="21" rx="6" ry="3.4" transform="rotate(-20 22 21)" fill="#ffffff" opacity="0.7" filter="url(#soft)"/>
  <!-- eye and grin, facing left -->
  <ellipse cx="20" cy="28" rx="6.5" ry="7" fill="url(#eye)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="17.5" cy="29" rx="3" ry="3.8" fill="#1b1f3b"/>
  <circle cx="18.6" cy="27.4" r="1.1" fill="#ffffff"/>
  <path d="M13 22 L 25 24" stroke="#1b1f3b" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M14 37 C 17 39.5, 22 39.5, 25 37" fill="none" stroke="#1b1f3b" stroke-width="2" stroke-linecap="round"/>
</svg>
