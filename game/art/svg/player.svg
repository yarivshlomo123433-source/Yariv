<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 64" width="48" height="64">
  <!-- Hero, facing right. Drawn at 2x the in-game size (24x32). Light from the top-left. -->
  <defs>
    <radialGradient id="suit" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#9cc8ff"/>
      <stop offset="0.38" stop-color="#4f86da"/>
      <stop offset="0.8" stop-color="#2d58a8"/>
      <stop offset="1" stop-color="#1f3f80"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="0.45" stop-color="#f2703f"/>
      <stop offset="1" stop-color="#b53a26"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2703f"/>
      <stop offset="1" stop-color="#b53a26"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e2f5"/>
    </radialGradient>
    <radialGradient id="foot" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#4f7fcf"/>
      <stop offset="1" stop-color="#1c3570"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- feet -->
  <ellipse cx="19" cy="58.5" rx="6" ry="4" fill="url(#foot)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="33" cy="58.5" rx="6" ry="4" fill="url(#foot)" stroke="#1b1f3b" stroke-width="2"/>

  <!-- scarf tail flowing back -->
  <path d="M12 33 C 6 33, 3 36, 1.5 41 C 5 40, 8 41, 10 44 C 11 40, 13 38, 15 37 Z"
        fill="url(#tail)" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/>

  <!-- body: one rounded capsule -->
  <rect x="8" y="3" width="36" height="54" rx="18" fill="url(#suit)" stroke="#1b1f3b" stroke-width="2.4"/>
  <!-- rim light on the shadow side -->
  <path d="M41 26 C 42.5 36, 41 47, 33 53" fill="none" stroke="#7fb0f5" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- glossy highlight -->
  <ellipse cx="18" cy="13" rx="6" ry="4.2" transform="rotate(-30 18 13)" fill="#ffffff" opacity="0.75" filter="url(#soft)"/>
  <ellipse cx="14.5" cy="21" rx="1.6" ry="2.4" fill="#ffffff" opacity="0.55"/>

  <!-- eye -->
  <ellipse cx="32" cy="20" rx="6.2" ry="7.2" fill="url(#eye)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="34" cy="21" rx="3" ry="4" fill="#1b1f3b"/>
  <circle cx="35.2" cy="18.8" r="1.3" fill="#ffffff"/>

  <!-- scarf band, wraps the body -->
  <path d="M8.5 31 C 18 34.5, 34 34.5, 43.5 31 L 43.5 38 C 34 41.5, 18 41.5, 8.5 38 Z"
        fill="url(#scarf)" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M12 33.6 C 20 35.8, 30 35.8, 38 33.8" fill="none" stroke="#ffd2b0" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>
</svg>
