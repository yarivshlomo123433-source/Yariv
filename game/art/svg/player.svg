<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 64" width="56" height="64">
  <!-- Hero, facing right. Drawn at 2x the in-game size (28x32). Light from the top-left. -->
  <defs>
    <radialGradient id="suit" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#9cc8ff"/>
      <stop offset="0.38" stop-color="#4f86da"/>
      <stop offset="0.8" stop-color="#2d58a8"/>
      <stop offset="1" stop-color="#1f3f80"/>
    </radialGradient>
    <linearGradient id="scarf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb07a"/>
      <stop offset="0.45" stop-color="#f2703f"/>
      <stop offset="1" stop-color="#b53a26"/>
    </linearGradient>
    <linearGradient id="tail" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2703f"/>
      <stop offset="1" stop-color="#b53a26"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6e2f5"/>
    </radialGradient>
    <radialGradient id="glove" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e9eef7"/>
      <stop offset="1" stop-color="#b9c6dc"/>
    </radialGradient>
    <radialGradient id="glove-back" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#dfe6f2"/>
      <stop offset="1" stop-color="#9aa9c4"/>
    </radialGradient>
    <radialGradient id="boot" cx="0.35" cy="0.25" r="0.85">
      <stop offset="0" stop-color="#ff9b6a"/>
      <stop offset="0.5" stop-color="#e2502f"/>
      <stop offset="1" stop-color="#9c2f1f"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.7"/>
    </filter>
  </defs>

  <!-- back arm (behind the body, a little darker) -->
  <path d="M15 33 C 11 36, 9 39, 7 42" fill="none" stroke="#1b1f3b" stroke-width="8" stroke-linecap="round"/>
  <path d="M15 33 C 11 36, 9 39, 7 42" fill="none" stroke="#24478c" stroke-width="4.4" stroke-linecap="round"/>
  <circle cx="6.5" cy="43" r="4.2" fill="url(#glove-back)" stroke="#1b1f3b" stroke-width="2"/>

  <!-- legs -->
  <path d="M22 44 V 55 M35 44 V 55" fill="none" stroke="#1b1f3b" stroke-width="8.4" stroke-linecap="round"/>
  <path d="M22 44 V 55 M35 44 V 55" fill="none" stroke="#2d58a8" stroke-width="4.6" stroke-linecap="round"/>
  <path d="M21 46 V 53" fill="none" stroke="#6f9fe6" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
  <path d="M34 46 V 53" fill="none" stroke="#6f9fe6" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- boots, toes pointing forward -->
  <path d="M15.5 59 C 15.5 54.5, 19 53.5, 22 53.5 C 26 53.5, 29 55.5, 29 59 C 29 61.5, 27 62.5, 22 62.5 C 17.5 62.5, 15.5 61.5, 15.5 59 Z"
        fill="url(#boot)" stroke="#1b1f3b" stroke-width="2"/>
  <path d="M28.5 59 C 28.5 54.5, 32 53.5, 35 53.5 C 39 53.5, 42 55.5, 42 59 C 42 61.5, 40 62.5, 35 62.5 C 30.5 62.5, 28.5 61.5, 28.5 59 Z"
        fill="url(#boot)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="20" cy="56.3" rx="2.2" ry="1.1" fill="#ffffff" opacity="0.6"/>
  <ellipse cx="33" cy="56.3" rx="2.2" ry="1.1" fill="#ffffff" opacity="0.6"/>

  <!-- scarf tail flowing back -->
  <path d="M14 29.5 C 8 29.5, 5 32, 3 36.5 C 6.5 35.8, 9.5 36.5, 11.5 39 C 12.5 35.5, 14.5 34, 17 33 Z"
        fill="url(#tail)" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/>

  <!-- body: one rounded capsule -->
  <rect x="11" y="2" width="34" height="47" rx="17" fill="url(#suit)" stroke="#1b1f3b" stroke-width="2.4"/>
  <!-- rim light on the shadow side -->
  <path d="M42 23 C 43.5 32, 42 40, 35 46" fill="none" stroke="#7fb0f5" stroke-width="1.6" stroke-linecap="round" opacity="0.55"/>
  <!-- glossy highlight -->
  <ellipse cx="20.5" cy="11.5" rx="5.8" ry="4" transform="rotate(-30 20.5 11.5)" fill="#ffffff" opacity="0.75" filter="url(#soft)"/>
  <ellipse cx="17" cy="19.5" rx="1.5" ry="2.3" fill="#ffffff" opacity="0.55"/>

  <!-- eye -->
  <ellipse cx="34" cy="17.5" rx="6" ry="7" fill="url(#eye)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="36" cy="18.5" rx="2.9" ry="3.9" fill="#1b1f3b"/>
  <circle cx="37.2" cy="16.4" r="1.25" fill="#ffffff"/>
  <!-- small smile -->
  <path d="M33 27.2 C 35 28.4, 37.5 28.2, 39.2 26.6" fill="none" stroke="#1b1f3b" stroke-width="1.5" stroke-linecap="round"/>

  <!-- scarf band, wraps the body -->
  <path d="M11.5 29 C 21 32.5, 35 32.5, 44.5 29 L 44.5 35.5 C 35 39, 21 39, 11.5 35.5 Z"
        fill="url(#scarf)" stroke="#1b1f3b" stroke-width="2" stroke-linejoin="round"/>
  <path d="M15 31.5 C 22 33.5, 31 33.5, 39 31.7" fill="none" stroke="#ffd2b0" stroke-width="1.2" stroke-linecap="round" opacity="0.8"/>

  <!-- front arm, swinging forward -->
  <path d="M41 38 C 45 39, 48 41, 50 44" fill="none" stroke="#1b1f3b" stroke-width="8" stroke-linecap="round"/>
  <path d="M41 38 C 45 39, 48 41, 50 44" fill="none" stroke="#3a6cc4" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M42.5 37.4 C 45 38.2, 47 39.4, 48.4 41" fill="none" stroke="#8cbaf7" stroke-width="1.1" stroke-linecap="round" opacity="0.7"/>
  <circle cx="50.5" cy="45" r="4.4" fill="url(#glove)" stroke="#1b1f3b" stroke-width="2"/>
  <ellipse cx="49.3" cy="43.6" rx="1.4" ry="1" fill="#ffffff"/>
</svg>
