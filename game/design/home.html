<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coin Hopper home screen mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@700;800;900&display=swap">
<style>
  /* Home screen mockup, landscape phone (844 x 390). Images are filled in by render-mockup.js. */
  :root {
    --ink: #1b1f3b;
    --gold-1: #fff3b0; --gold-2: #ffcc33; --gold-3: #c47f0a;
    --play-1: #7df07a; --play-2: #2fbf4a; --play-3: #17863a;
    --blue-1: #8cc4ff; --blue-2: #3f86ea; --blue-3: #2453b0;
    --purple-1: #c8a6ff; --purple-2: #8a55f0; --purple-3: #5730b0;
    --glass: rgba(27, 31, 59, 0.55);
    --display: "Lilita One", "Trebuchet MS", sans-serif;
    --body: "Nunito", system-ui, sans-serif;
  }
  html, body { margin: 0; height: 100%; }
  body { font-family: var(--body); color: #fff; overflow: hidden; }
  .stage { position: relative; width: 844px; height: 390px; overflow: hidden;
    background: linear-gradient(#4aa6ea 0%, #8fd0f7 55%, #d8f2ff 100%); }
  /* World behind the menu */
  .sun { position: absolute; left: 50%; top: -120px; width: 520px; height: 520px; transform: translateX(-30%);
    background: radial-gradient(circle, rgba(255,255,255,0.55), rgba(255,255,255,0) 60%); }
  .cloud { position: absolute; opacity: 0.95; }
  .hill { position: absolute; border-radius: 50%; }
  .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 74px; display: flex; flex-direction: column; }
  .ground .g, .ground .d { height: 37px; background-size: 37px 37px; background-repeat: repeat-x; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 45% 55%, rgba(0,0,0,0) 55%, rgba(10,14,40,0.35) 100%); }

  /* Top bar */
  .top { position: absolute; top: 12px; left: 14px; right: 14px; display: flex; align-items: center; gap: 10px; }
  .chip { display: flex; align-items: center; gap: 8px; background: var(--glass); border: 2px solid rgba(255,255,255,0.28);
    border-radius: 999px; padding: 4px 14px 4px 4px; backdrop-filter: blur(6px); box-shadow: 0 4px 0 rgba(0,0,0,0.18); }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #ffffff, #cfe4ff);
    border: 2.5px solid #fff; overflow: hidden; display: grid; place-items: center; }
  .avatar img { width: 34px; margin-top: 8px; }
  .who b { display: block; font: 900 15px var(--body); line-height: 1; }
  .who span { font: 800 11px var(--body); color: #ffe27a; }
  .spacer { flex: 1; }
  .stat { padding: 4px 14px 4px 6px; font: 900 15px var(--body); }
  .stat img { width: 26px; }
  .round-btn { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 19px;
    background: var(--glass); border: 2px solid rgba(255,255,255,0.28); box-shadow: 0 4px 0 rgba(0,0,0,0.18); }

  /* Logo */
  .logo { position: absolute; left: 30px; top: 74px; transform: rotate(-4deg); }
  .word { position: relative; display: block; font: 400 54px/0.95 var(--display); letter-spacing: 1px; }
  .word span { display: block; }
  .word .back { position: absolute; inset: 0; color: var(--ink); -webkit-text-stroke: 8px var(--ink); text-shadow: 0 6px 0 var(--ink), 0 12px 18px rgba(0,0,0,0.3); }
  .word .front { position: relative; color: #fff; }
  .word.gold { margin-left: 26px; }
  .word.gold .front { background: linear-gradient(#fff6b8 10%, #ffcc33 55%, #ff8a1a 95%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tagline { position: absolute; left: 40px; top: 204px; font: 800 13px var(--body); color: #1b1f3b; background: rgba(255,255,255,0.75);
    padding: 5px 12px; border-radius: 999px; transform: rotate(-4deg); }

  /* Character showcase */
  .show { position: absolute; left: 300px; top: 70px; width: 230px; height: 300px; }
  .pedestal { position: absolute; left: 25px; bottom: 34px; width: 180px; height: 46px; border-radius: 50%;
    background: radial-gradient(ellipse at 50% 35%, #ffffff 0%, #e7f2ff 45%, #9cc3ee 100%); border: 3px solid var(--ink);
    box-shadow: 0 8px 0 #4e72a6, 0 14px 22px rgba(0,0,0,0.25); }
  .glow { position: absolute; left: 15px; top: 10px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.8), rgba(255,255,255,0) 65%); }
  .hero { position: absolute; left: 50%; bottom: 60px; width: 168px; transform: translateX(-50%); filter: drop-shadow(0 6px 6px rgba(0,0,0,0.25)); }
  .arrow { position: absolute; top: 112px; width: 40px; height: 52px; border-radius: 14px; display: grid; place-items: center;
    font: 400 26px var(--display); color: var(--ink); background: linear-gradient(#ffffff, #dfe9f7); border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); }
  .arrow.l { left: -8px; } .arrow.r { right: -8px; }
  .plate { position: absolute; left: 50%; bottom: -2px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .plate b { font: 400 22px var(--display); letter-spacing: 1px; color: #fff; -webkit-text-stroke: 4px var(--ink); paint-order: stroke fill; }
  .dots { display: flex; gap: 5px; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(27,31,59,0.35); }
  .dots i.on { background: #fff; box-shadow: 0 0 0 2px var(--ink); }
  .roster { position: absolute; left: 534px; top: 330px; display: none; }

  /* Buttons */
  .menu { position: absolute; right: 22px; top: 76px; width: 250px; display: flex; flex-direction: column; gap: 12px; }
  .btn3d { position: relative; border-radius: 20px; border: 3px solid var(--ink); padding: 10px 16px 12px; text-align: left;
    display: flex; align-items: center; gap: 12px; color: #fff; box-shadow: 0 6px 0 var(--ink), 0 12px 20px rgba(0,0,0,0.22); }
  .btn3d::after { content: ""; position: absolute; left: 10px; right: 10px; top: 5px; height: 38%; border-radius: 14px 14px 30px 30px; background: linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0)); pointer-events: none; }
  .btn3d .ic { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; background: rgba(255,255,255,0.22); font-size: 22px; flex: none; }
  .btn3d b { display: block; font: 400 25px/1 var(--display); letter-spacing: 0.5px; -webkit-text-stroke: 4px rgba(27,31,59,0.85); paint-order: stroke fill; }
  .btn3d small { display: block; font: 800 11.5px var(--body); opacity: 0.95; margin-top: 3px; }
  .play { background: linear-gradient(var(--play-1), var(--play-2) 55%, var(--play-3)); padding: 14px 18px 16px; }
  .play b { font-size: 34px; }
  .friends { background: linear-gradient(var(--blue-1), var(--blue-2) 55%, var(--blue-3)); }
  .join { background: linear-gradient(var(--purple-1), var(--purple-2) 55%, var(--purple-3)); padding: 7px 14px 9px; }
  .join b { font-size: 20px; }
  .badge { position: absolute; right: -8px; top: -10px; background: #ff4d6d; color: #fff; font: 900 11px var(--body); padding: 3px 8px; border-radius: 999px; border: 2.5px solid var(--ink); }

  .bottom { position: absolute; left: 18px; bottom: 10px; font: 800 11px var(--body); color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,0.5); }
</style>
</head>
<body>
<div class="stage">
  <div class="sun"></div>
  <img class="cloud" src="{{cloud}}" style="left:40px;top:18px;width:110px">
  <img class="cloud" src="{{cloud}}" style="left:500px;top:30px;width:90px;opacity:0.8">
  <img class="cloud" src="{{cloud}}" style="left:660px;top:-6px;width:130px;opacity:0.7">
  <div class="hill" style="left:-80px;bottom:30px;width:360px;height:180px;background:#9ad7a0"></div>
  <div class="hill" style="left:220px;bottom:20px;width:420px;height:160px;background:#7cc489"></div>
  <div class="hill" style="left:560px;bottom:30px;width:380px;height:190px;background:#9ad7a0"></div>
  <div class="ground"><div class="g" style="background-image:url({{grass}})"></div><div class="d" style="background-image:url({{dirt}})"></div></div>
  <div class="vignette"></div>

  <div class="top">
    <div class="chip"><div class="avatar"><img src="{{char-hopper}}" alt=""></div><div class="who"><b>Yariv</b><span>Level 4 · Racer</span></div></div>
    <div class="spacer"></div>
    <div class="chip stat"><img src="{{trophy}}" alt="">12</div>
    <div class="chip stat"><img src="{{coin}}" alt="">1,240</div>
    <div class="round-btn">🔊</div>
    <div class="round-btn">⚙️</div>
  </div>

  <div class="logo"><span class="word"><span class="back">COIN</span><span class="front">COIN</span></span><span class="word gold"><span class="back">HOPPER</span><span class="front">HOPPER</span></span></div>
  <div class="tagline">Race · Jump · Zap your friends</div>

  <div class="show">
    <div class="glow"></div>
    <div class="pedestal"></div>
    <img class="hero" src="{{char-hopper}}" alt="Hopper">
    <div class="arrow l">‹</div><div class="arrow r">›</div>
    <div class="plate"><b>HOPPER</b><div class="dots"><i class="on"></i><i></i><i></i><i></i><i></i><i></i></div></div>
  </div>

  <div class="menu">
    <div class="btn3d play"><div class="ic">▶</div><div><b>PLAY</b><small>vs bots · 3 races</small></div></div>
    <div class="btn3d friends"><div class="ic">👥</div><div><b>FRIENDS</b><small>Race up to 3 friends</small></div><span class="badge">NEW</span></div>
    <div class="btn3d join"><div class="ic">#</div><div><b>JOIN ROOM</b><small>Code or invite link</small></div></div>
  </div>

  <div class="bottom">Best time 0:24.31 · 7 races won this week</div>
</div>
</body>
</html>
